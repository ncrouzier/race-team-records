<div class="jumbotron auth-page">
    <div class="member-card auth-card">
        <h2 class="auth-title">Log in</h2>
        <p class="auth-subtitle">Log in to your MCRRC Racing Team account.</p>

        <!-- show any messages that come back with authentication -->
        <div ng-show="message.length > 0" class="alert alert-danger">{{message}}</div>

        <form name="form" ng-submit="login(user)">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="text" class="form-control" name="email" ng-model="user.email" autocomplete="username" auto-focus>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" class="form-control" name="password" ng-model="user.password" autocomplete="current-password">
                <a class="auth-inline-link" ui-sref="/forgot-password">Forgot password?</a>
            </div>
            <button type="submit" class="member-primary-btn auth-submit">Log in</button>
        </form>

        <div class="auth-or"><span>or</span></div>
        <a class="mcrrc-btn auth-submit" ng-href="{{emailLoginHref}}"><i class="fa fa-envelope-o"></i> Email me a login link instead</a>

        <p class="auth-footer">Don't have an account? <a ui-sref="/signup">Create an account</a></p>
    </div>
</div>
