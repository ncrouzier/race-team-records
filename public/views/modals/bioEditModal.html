<div class="bio-edit-modal">
    <div class="modal-header">
        <h3 class="modal-title">Edit your bio</h3>
        <p class="bio-edit-subtitle">Shown on your public bio page. Leave a question blank to hide it.</p>
    </div>
    <div class="modal-body bio-edit-form">
        <form name="formbio">
            <div class="bio-field" ng-repeat="field in bioFields">
                <label>{{field.label}}</label>
                <textarea app-tinymce="field.options" ng-model="formData[field.key]"></textarea>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="mcrrc-btn" ng-click="cancel()">Cancel</button>
        <button type="submit" class="mcrrc-btn member-primary-btn" ng-click="saveBio()">
            <i class="fa fa-check"></i> Save
        </button>
    </div>
</div>
