name: Build and publish image

# Builds the production image on GitHub's native amd64 runners and pushes it to
# GHCR, so the DigitalOcean droplet only ever pulls and runs. Building on the
# droplet itself would mean installing ~550MB of devDependencies and running
# terser next to a live Mongo on a 2GiB box; building on a Mac would mean an
# emulated amd64 build, since Apple Silicon is arm64 and droplets are not.

on:
  push:
    # feature/digitalocean is here so the pipeline can be proven before master
    # depends on it. Safe to leave: the `latest` tag below is gated on the
    # default branch, so a feature build publishes only its own sha- and
    # branch-tagged images and can never become what the server pulls.
    branches: [master, feature/digitalocean]
  workflow_dispatch:

# A second push while one is in flight makes the first result obsolete.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically; no PAT needed to push from within the repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what Dokploy pulls, so it is deliberately restricted to the
      # default branch — a feature build must never be able to redefine it.
      # Every build also gets an immutable sha- tag (the rollback target) and a
      # branch- tag, which is how you deploy a feature build on purpose.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every run reinstalls all dependencies and re-runs
          # bower from scratch. mode=max keeps the intermediate build stage too.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pulls the freshly published image on the droplet and restarts the app
      # container. Optional: set the DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
      # repository secrets to turn a push into an end-to-end deploy. Leave them
      # unset and the workflow just publishes the image, and you deploy by hand
      # with `docker compose pull app && docker compose up -d app`.
      #
      # `secrets` is not available to step-level `if:`, hence the env check
      # inside the script rather than in the `if:`.
      #
      # Default branch only: a feature build does not move `latest`, so
      # deploying from one would restart the server onto the image it is
      # already running.
      - name: Deploy to droplet
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Deploy secrets not set - image published, skipping deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key rather than accepting whatever answers, so a
          # hijacked DNS record cannot collect the deploy key.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@$DEPLOY_HOST" \
            'cd /opt/mcrrc && docker compose pull app && docker compose up -d app && docker image prune -f'

          echo "Deployed."
