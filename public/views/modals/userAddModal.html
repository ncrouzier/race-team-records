<div class="site-modal user-modal">
<div class="modal-header site-modal-header">
    <div>
        <h3 class="modal-title">Add user</h3>
    </div>
</div>
<div class="modal-body" style="overflow: visible;">
    <form name="formAddUser">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group"
                    ng-class="{ 'has-error' : formAddUser.username.$invalid && !formAddUser.username.$pristine}">
                    <label for="addUsername">Username</label>
                    <input id="addUsername" type="text" name="username" class="form-control" ng-model="formData.username" required>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group"
                    ng-class="{ 'has-error' : formAddUser.email.$invalid && !formAddUser.email.$pristine}">
                    <label for="addEmail">Email</label>
                    <input id="addEmail" type="email" name="email" class="form-control" ng-model="formData.email" required>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group"
                    ng-class="{ 'has-error' : formAddUser.password.$invalid && !formAddUser.password.$pristine}">
                    <label for="addPassword">Password</label>
                    <input id="addPassword" type="password" name="password" class="form-control"
                        ng-model="formData.password" required ng-minlength="8" maxlength="64">
                    <p class="help-block" ng-show="formAddUser.password.$dirty && formAddUser.password.$error.minlength">
                        At least 8 characters.
                    </p>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label for="addRole">Role</label>
                    <select id="addRole" name="role" class="form-control" ng-model="formData.role"
                        ng-options="role for role in roleOptions" required>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Associated member <span class="user-optional">(optional)</span></label>
                    <ui-select ng-model="formData.member" theme="select2" class="user-member-select"
                        append-to-body="true" allow-clear="true">
                        <ui-select-match placeholder="Select a member" allow-clear="true">
                            {{$select.selected.firstname}} {{$select.selected.lastname}}
                        </ui-select-match>
                        <ui-select-choices repeat="member in membersList | memberFilter: $select.search">
                            <span ng-class="{'past-member' : member.memberStatus === 'past'}">
                                <div ng-bind-html="(member.firstname +' ' + member.lastname) | highlight: $select.search"></div>
                                <small><span ng-if="member.memberStatus === 'past'">(past)</span></small>
                            </span>
                        </ui-select-choices>
                    </ui-select>
        </div>
    </form>
</div>
<div class="modal-footer site-modal-footer">
    <button type="button" class="mcrrc-btn" ng-click="cancel()">Cancel</button>
    <span class="site-modal-footer-spacer"></span>
    <button type="submit" class="member-primary-btn" ng-click="createUser()" ng-disabled="formAddUser.$invalid">
        <i class="fa fa-plus"></i> Create user
    </button>
</div>
</div>
