<div class="jumbotron auth-page">
    <div class="member-card auth-card">
        <h2 class="auth-title">Reset password</h2>
        <p class="auth-subtitle" ng-hide="success || tokenExpired">Choose a new password, at least 8 characters.</p>

        <div ng-show="message && !tokenExpired" class="alert" ng-class="{'alert-success': success, 'alert-danger': !success}">
            {{message}}
        </div>

        <div ng-show="tokenExpired" class="alert alert-danger">
            This password reset link is invalid or has expired.
            <a ui-sref="/forgot-password">Request a new one</a>.
        </div>

        <form name="form" ng-submit="resetPassword()" ng-hide="success || tokenExpired">
            <div class="form-group" ng-class="{'has-error': form.password.$dirty && form.password.$invalid}">
                <label for="resetPassword">New password</label>
                <input id="resetPassword" type="password" class="form-control" name="password" ng-model="newPassword" required
                    ng-minlength="8" maxlength="64" autocomplete="new-password">
                <p class="help-block" ng-show="form.password.$dirty && form.password.$error.minlength">
                    Password must be at least 8 characters.
                </p>
            </div>
            <div class="form-group">
                <label for="resetConfirm">Confirm new password</label>
                <input id="resetConfirm" type="password" class="form-control" name="confirmPassword" ng-model="confirmPassword" autocomplete="new-password" required>
            </div>
            <div ng-show="newPassword && confirmPassword && newPassword !== confirmPassword" class="alert alert-danger">
                Passwords do not match.
            </div>
            <button ng-disabled="!form.$valid || newPassword !== confirmPassword" type="submit" class="member-primary-btn auth-submit">
                Reset password
            </button>
        </form>

        <a class="member-primary-btn auth-submit" ng-show="success" ui-sref="/login">Log in</a>
    </div>
</div>
