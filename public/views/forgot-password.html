<div class="jumbotron auth-page">
    <div class="member-card auth-card">
        <h2 class="auth-title">Forgot password</h2>
        <p class="auth-subtitle">Enter your email and we'll send you a link to choose a new password.</p>

        <div ng-show="message" class="alert" ng-class="{'alert-success': success, 'alert-danger': !success}">
            {{message}}
        </div>

        <form name="form" ng-submit="requestReset(email)" ng-hide="success">
            <div class="form-group">
                <label for="forgotEmail">Email address</label>
                <input id="forgotEmail" type="email" class="form-control" name="email" ng-model="email" autocomplete="email" required auto-focus>
            </div>
            <button ng-disabled="!form.$valid" type="submit" class="member-primary-btn auth-submit">Send reset link</button>
        </form>

        <p class="auth-footer"><a ui-sref="/login"><i class="fa fa-arrow-left"></i> Back to log in</a></p>
    </div>
</div>
