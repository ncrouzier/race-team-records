<div class="jumbotron auth-page">
    <div class="member-card auth-card">
        <h2 class="auth-title">Create an account</h2>
        <p class="auth-subtitle">An admin approves new accounts before you can log in.</p>

        <!-- show any messages that come back with authentication -->
        <div ng-show="message" class="alert alert-danger">{{message}}</div>

        <!-- Success message after registration -->
        <div ng-show="success" class="alert alert-success">
            <i class="fa fa-check-circle"></i> {{successMessage}}
        </div>

        <form name="form" ng-submit="signup(user)" ng-hide="success">
            <div class="form-group">
                <label for="signupName">Name</label>
                <input id="signupName" type="text" class="form-control" name="username" ng-model="user.username" autocomplete="name" required auto-focus>
            </div>
            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input id="signupEmail" type="email" class="form-control" name="email" ng-model="user.email" autocomplete="email" required>
            </div>
            <div class="form-group" ng-class="{'has-error': form.password.$dirty && form.password.$invalid}">
                <label for="signupPassword">Password</label>
                <input id="signupPassword" type="password" class="form-control" name="password" ng-model="user.password" required
                    ng-minlength="8" maxlength="64" autocomplete="new-password">
                <p class="help-block" ng-show="form.password.$dirty && form.password.$error.minlength">
                    Password must be at least 8 characters.
                </p>
            </div>

            <button ng-disabled="!form.$valid" type="submit" class="member-primary-btn auth-submit">Create account</button>
        </form>

        <p class="auth-footer">Already have an account? <a ui-sref="/login">Log in</a></p>
    </div>
</div>
