<div class="jumbotron">
    <!-- Navigation -->
    <ul class="nav nav-tabs">
        <li role="presentation" ui-sref-active="active">
            <a ui-sref="/stats/team">Team Stats</a>
        </li>
        <li role="presentation" ui-sref-active="active">
            <a ui-sref="/stats/us-map">US Races Map</a>
        </li>
        <li role="presentation" ui-sref-active="active">
            <a ui-sref="/stats/world-map">World Races Map</a>
        </li>
        <li role="presentation" ui-sref-active="active">
            <a ui-sref="/stats/progress-map">Progress Map</a>
        </li>
        <li role="presentation" ui-sref-active="active">
            <a ui-sref="/stats/awards">Awards</a>
        </li>
        <li role="presentation" ui-sref-active="active" ng-if="user.role === 'admin'">
            <a ui-sref="/stats/participation">Participation Stats</a>
        </li>
        <li role="presentation" ui-sref-active="active" ng-if="user.role == 'admin'">
            <a ui-sref="/stats/members">Team Members Stats</a>
        </li>
    </ul>

    <!-- Awards Content -->
    <div style="margin-top: 20px;">
        <h2><i class="fa fa-trophy"></i> ROY & MUTROY Awards</h2>
        <p class="text-muted"></p>

        <div ng-if="loadingStates.awards" class="text-center" style="padding: 40px;">
            <i class="fa fa-spinner fa-spin fa-2x"></i>
        </div>

        <div ng-if="!loadingStates.awards && awardsByYear.length === 0" class="text-muted text-center"
            style="padding: 40px;">
            No awards found.
        </div>

        <div ng-repeat="yearGroup in awardsByYear" style="margin-bottom: 25px;">
            <h5 style="border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-bottom: 10px;">
                {{yearGroup.year}}
            </h5>
            <div class="row">
                <div class="col-sm-6 col-md-4" ng-repeat="award in yearGroup.awards" style="margin-bottom: 12px;">
                    <div
                        style="display: flex; align-items: center; gap: 10px; padding: 10px; background: #f9f9f9; border-radius: 4px; border: 1px solid #eee;">
                        <img ng-if="award.img" ng-src="{{award.img}}" style="width: 32px; height: 32px;">
                        <div>
                            <a ui-sref="/members/member({ member: award.member.username })" style="font-weight: 600;">
                                {{award.member.firstname}} {{award.member.lastname}}
                            </a>
                            <br>
                            <small class="text-muted">
                                {{award.type}}
                                <span ng-if="award.category"> - {{award.category}}</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
