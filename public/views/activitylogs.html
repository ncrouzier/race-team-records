<div class="jumbotron">
    <div class="racetypes-content">
        <div class="panel panel-default">
            <div class="panel-heading" style="display: flex; justify-content: space-between; align-items: center;">
                <h4 style="margin: 0;"><i class="fa fa-list-alt"></i> Activity Log</h4>
                <button class="btn btn-sm btn-default" ng-click="markActivityLogsSeen()"
                    ng-disabled="!unseenActivityCount">
                    <i class="fa fa-check"></i> Mark all as seen
                    <span ng-if="unseenActivityCount > 0">({{unseenActivityCount}})</span>
                </button>
            </div>
            <div class="panel-body" style="padding: 0;">
                <!-- Filters row -->
                <div
                    style="padding: 10px 15px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <label style="margin: 0; font-weight: 600;">Action:</label>
                        <select class="form-control input-sm" ng-model="actionFilter"
                            ng-options="action for action in actionsList" style="width: 150px;">
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px; flex: 1; min-width: 200px;">
                        <label style="margin: 0; font-weight: 600;">User:</label>
                        <div style="position: relative; flex: 1;">
                            <input type="text" class="form-control input-sm" ng-model="searchQuery"
                                ng-model-options="{debounce: 400}" placeholder="Filter by username..."
                                style="padding-right: 25px;">
                            <span class="fa fa-times-circle hoverhand" ng-show="searchQuery" ng-click="searchQuery=''"
                                style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #999;"></span>
                        </div>
                    </div>
                    <div style="color: #888; font-size: 0.9em;">
                        {{totalItems}} entries
                    </div>
                </div>
                <!-- Table -->
                <table class="table table-striped table-hover" style="margin-bottom: 0;">
                    <thead>
                        <tr>
                            <th style="width: 140px;">Date</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Description</th>
                            <th>Target</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-if="!logsList || logsList.length === 0">
                            <td colspan="6" class="text-center text-muted" style="padding: 40px;">
                                <i class="fa fa-info-circle"></i> No activity logs found.
                            </td>
                        </tr>
                        <tr ng-repeat="log in logsList" ng-class="{'crf-row-unseen': log.unseen}">
                            <td style="white-space: nowrap;">
                                <span ng-if="log.unseen" class="crf-nav-dot" title="Unseen"></span>
                                {{log.createdAt | date:'yyyy-MM-dd HH:mm'}}
                            </td>
                            <td>{{log.username}}</td>
                            <td>
                                <span class="label label-info"
                                    style="display: inline-block; min-width: 75px; text-align: center;">{{log.action}}</span>
                            </td>
                            <td>{{log.description}}</td>
                            <td>
                                <a ng-if="log.targetName && log.targetType === 'member' && log.metadata.targetUsername"
                                    ui-sref="/members/member/bio({member: log.metadata.targetUsername})">{{log.targetName}}</a>
                                <a ng-if="log.targetName && (log.targetType === 'compraceform' || log.targetType === 'compraceform_response') && (log.targetId || log.metadata.formId)"
                                    ui-sref="/comp-race-forms/detail({formId: log.targetType === 'compraceform' ? log.targetId : log.metadata.formId})">{{log.targetName}}</a>
                                <span ng-if="log.targetName && !(log.targetType === 'member' && log.metadata.targetUsername) && !((log.targetType === 'compraceform' || log.targetType === 'compraceform_response') && (log.targetId || log.metadata.formId))">{{log.targetName}}</span>
                                <span ng-if="!log.targetName" class="text-muted">-</span>
                            </td>
                            <td class="text-center" style="white-space: nowrap;">
                                <i class="fa fa-eye hoverhand" ng-click="viewLogDetail(log)" title="View details" style="margin-right: 8px;"></i>
                                <i class="fa fa-trash hoverhand" ng-click="deleteLog(log)" title="Delete entry"></i>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <!-- Pagination -->
                <div ng-if="totalPages > 1"
                    style="padding: 10px 15px; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        Page {{currentPage}} of {{totalPages}}
                    </div>
                    <div>
                        <button class="btn btn-sm btn-default" ng-click="prevPage()" ng-disabled="currentPage <= 1">
                            <i class="fa fa-chevron-left"></i> Previous
                        </button>
                        <button class="btn btn-sm btn-default" ng-click="nextPage()"
                            ng-disabled="currentPage >= totalPages">
                            Next <i class="fa fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
